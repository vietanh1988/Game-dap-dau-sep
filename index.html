<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚾ Đập Đầu Sếp – Office Hit</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a1a2e;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    cursor: none;
    overflow-x: hidden;
    user-select: none;
  }
  /* hide mouse cursor on touch devices */
  @media (pointer: coarse) {
    body { cursor: default; }
    #cursor { display: none !important; }
  }

  /* ── Durian cursor ── */
  #cursor {
    position: fixed;
    width: 80px; height: 90px;
    pointer-events: none;
    z-index: 9999;
    transform-origin: 40px 84px;   /* pivot at wrist bottom */
    transform: translate(-40px, -84px) rotate(0deg);
    transition: transform 0.07s ease-out;
    filter: drop-shadow(0 0 7px rgba(80,160,0,0.55));
  }
  #cursor.swing {
    transform: translate(-40px, -84px) rotate(-70deg);
    transition: transform 0.09s cubic-bezier(.15,1.8,.4,1);
    filter: drop-shadow(0 0 16px rgba(120,200,0,0.95));
  }

  /* hit-freeze: boss shakes but stays visible */
  .boss-wrap.hit-freeze { animation: hit-shake 0.35s ease-out forwards; }
  @keyframes hit-shake {
    0%   { transform: translateY(0) rotate(0deg)   scale(1); }
    18%  { transform: translateY(-14px) rotate(-14deg) scale(1.18); }
    40%  { transform: translateY(4px)  rotate(10deg)  scale(1.05); }
    62%  { transform: translateY(-6px) rotate(-6deg)  scale(1.10); }
    80%  { transform: translateY(2px)  rotate(3deg)   scale(1.04); }
    100% { transform: translateY(0)    rotate(0deg)   scale(1); }
  }

  /* ── Header ── */
  #header {
    width: 100%; max-width: 780px;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px 4px; color: #fff;
    flex-wrap: wrap; gap: 4px;
  }
  .stat-box {
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 12px; padding: 6px 14px;
    text-align: center; min-width: 80px;
  }
  .stat-label { font-size: 10px; letter-spacing: 1px; opacity: .7; text-transform: uppercase; }
  .stat-value { font-size: clamp(18px, 5vw, 28px); font-weight: 700; color: #ffd700; line-height: 1.1; }
  #title-text {
    font-size: clamp(14px, 4vw, 20px); font-weight: 800;
    background: linear-gradient(90deg,#ff6b6b,#ffd700,#6bcbff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    text-align: center;
  }
  #timer-box .stat-value { color: #ff6b6b; }

  /* ── Timer bar ── */
  #timer-bar-wrap { width: 100%; max-width: 780px; padding: 0 12px 8px; }
  #timer-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.15); border-radius: 4px; overflow: hidden; }
  #timer-bar { height: 100%; background: linear-gradient(90deg,#ff6b6b,#ffd700); border-radius: 4px; transition: width .5s linear; width: 100%; }

  /* ── Game wrapper (holds scaled game-area) ── */
  #gw {
    width: 100%;
    max-width: 780px;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  /* ── Game area (fixed internal size, scaled by JS) ── */
  #game-area {
    position: relative; width: 780px; height: 510px;
    border-radius: 18px; overflow: hidden;
    border: 3px solid rgba(255,255,255,0.3);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    flex-shrink: 0;
    transform-origin: top left;
    background: linear-gradient(180deg, #e8f4f8 0%, #d0e8f5 25%, #c4d8b0 60%, #a8c890 100%);
  }

  /* floor */
  .floor {
    position: absolute; bottom: 0; left: 0; right: 0; height: 82px;
    background: linear-gradient(180deg, #8aab6e, #6b8c50);
    border-top: 4px solid #5a7a42;
  }
  .deco { position: absolute; pointer-events: none; font-size: 28px; }

  /* ── Boss slot (no partitions — heads pop from floor) ── */
  .boss-slot {
    position: absolute; bottom: 82px; /* sits flush at floor top */
    width: 164px; height: 172px;
    display: flex; justify-content: center; align-items: flex-end;
    z-index: 20; overflow: hidden;
  }
  .boss-wrap {
    position: relative;
    width: 164px; height: 164px;
    display: flex; flex-direction: column; align-items: center;
    cursor: none;
    transform: translateY(168px);
    transition: transform 0.22s cubic-bezier(.34,1.4,.64,1);
    will-change: transform;
  }
  .boss-wrap.visible { transform: translateY(0); }
  .boss-wrap.hit-anim { animation: boss-hit 0.42s ease-out forwards; }

  @keyframes boss-hit {
    0%   { transform: translateY(0)    rotate(0deg)   scale(1); }
    15%  { transform: translateY(-18px) rotate(-18deg) scale(1.2); }
    55%  { transform: translateY(8px)  rotate(12deg)  scale(0.85); }
    100% { transform: translateY(168px) rotate(0deg)  scale(1); }
  }

  .boss-svg { width: 158px; height: 158px; display: block; }

  /* ground-shadow under each boss slot */
  .ground-shadow {
    position: absolute; bottom: 84px;
    width: 130px; height: 18px;
    background: rgba(0,0,0,0.22);
    border-radius: 50%;
    z-index: 18; pointer-events: none;
  }

  /* ── Reaction bubble ── */
  .reaction-bubble {
    position: absolute;
    top: -52px; left: 50%;
    transform: translateX(-50%) scale(0);
    background: #fffde7;
    border: 2.5px solid #c62828;
    border-radius: 14px;
    padding: 6px 13px;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    pointer-events: none;
    z-index: 99;
    animation: pop-bubble 0.9s ease-out forwards;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
  }
  .reaction-bubble::after {
    content: ''; position: absolute;
    bottom: -10px; left: 50%; transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #333;
  }
  @keyframes pop-bubble {
    0%   { transform: translateX(-50%) scale(0) rotate(-8deg); opacity: 1; }
    20%  { transform: translateX(-50%) scale(1.2) rotate(4deg); }
    40%  { transform: translateX(-50%) scale(0.95) rotate(0deg); }
    70%  { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
    100% { transform: translateX(-50%) scale(0.8) rotate(0deg) translateY(-20px); opacity: 0; }
  }

  /* ── Score popup ── */
  .score-pop {
    position: absolute;
    font-size: 22px; font-weight: 800;
    color: #ffd700; text-shadow: 0 2px 4px rgba(0,0,0,.5);
    pointer-events: none; z-index: 100;
    animation: score-float 0.9s ease-out forwards;
  }
  @keyframes score-float {
    0%   { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-70px) scale(1.3); }
  }

  /* ── Combo ── */
  #combo-display {
    position: absolute; top: 14px; right: 16px;
    font-size: 15px; font-weight: 800; color: #ff6b6b;
    text-shadow: 0 0 10px rgba(255,107,107,.8);
    opacity: 0; transition: opacity .3s; z-index: 50; letter-spacing: 2px;
  }
  #combo-display.active { opacity: 1; }

  /* ── Overlays ── */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(10,10,30,0.9);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 200; border-radius: 16px;
    backdrop-filter: blur(4px);
  }
  .overlay h2 {
    font-size: 36px; font-weight: 900;
    background: linear-gradient(90deg,#ff6b6b,#ffd700);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 10px;
  }
  .overlay p { color: #ccc; font-size: 15px; margin-bottom: 6px; }
  .overlay .big-score {
    font-size: 68px; font-weight: 900; color: #ffd700;
    text-shadow: 0 0 24px rgba(255,215,0,.6);
    line-height: 1; margin: 12px 0;
  }
  .btn {
    margin-top: 18px; padding: 13px 36px;
    font-size: 17px; font-weight: 700;
    border: none; border-radius: 50px;
    background: linear-gradient(90deg,#ff6b6b,#ff9f43);
    color: white; cursor: pointer;
    box-shadow: 0 6px 24px rgba(255,107,107,.5);
    transition: transform .15s, box-shadow .15s; letter-spacing: 1px;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(255,107,107,.7); }
  .btn:active { transform: translateY(1px); }

  /* upload */
  #upload-area { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #upload-area label {
    padding: 9px 22px; border: 2px dashed rgba(255,255,255,.4);
    border-radius: 10px; color: #aaa; font-size: 13px; cursor: pointer;
    transition: border-color .2s, color .2s;
  }
  #upload-area label:hover { border-color: #ffd700; color: #ffd700; }
  #upload-area input { display: none; }
  #preview-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #ffd700; display: none; }
</style>
</head>

<!-- ══ DURIAN CURSOR ══ -->

  <line x1="30" y1="77" x2="50" y2="77" stroke="#a07438" stroke-width=".7" opacity=".5"/>

</div>

<!-- ══ HEADER ══ -->
<div id="header">
  <div class="stat-box">
    <div class="stat-label">Điểm</div>
    <div class="stat-value" id="score-display">0</div>
  </div>
  <div>
    <div id="title-text">⚾ Đập Đầu Sếp<br>Office Hit</div>

  <!-- START overlay -->
  <div class="overlay" id="start-overlay">
    <h2>⚾ Đập Đầu Sếp!</h2>

<script>
// ════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════
const TOTAL_TIME    = 60;
const NUM_HOLES     = 4;
const BASE_SHOW_MS  = 2600;   // longer so player can hear curse
const MIN_SHOW_MS   = 1200;
const BASE_INTERVAL = 2000;   // slower spawns
const MIN_INTERVAL  = 900;
const JITTER        = 0.35;
// 4 slots spread evenly across 780px (no partitions)
const SLOTS_X       = [30, 210, 390, 570];

// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let score = 0, timeLeft = TOTAL_TIME, running = false;
let combo = 0, comboTimer = null;
let customFace = null;
let spawnTimer = null, countdownTimer = null;
let activeSlots = new Set();

// ════════════════════════════════════════════════════════
//  DOM refs
// ════════════════════════════════════════════════════════
const cursorEl       = document.getElementById('cursor');
const gameArea       = document.getElementById('game-area');
const gameWrapper    = document.getElementById('gw');

// ── Responsive scale ──
let gameScale = 1;
function updateScale() {
  const w = Math.min(window.innerWidth - 4, 780);
  gameScale = w / 780;
  gameArea.style.transform = `scale(${gameScale})`;
  gameWrapper.style.height = Math.round(510 * gameScale) + 'px';
}
window.addEventListener('resize', updateScale);
updateScale();
const scoreDisplay   = document.getElementById('score-display');
const timerDisplay   = document.getElementById('timer-display');
const timerBar       = document.getElementById('timer-bar');
const startOverlay   = document.getElementById('start-overlay');
const gameoverOverlay= document.getElementById('gameover-overlay');
const finalScore     = document.getElementById('final-score');
const rankText       = document.getElementById('rank-text');
const combDisplay    = document.getElementById('combo-display');
const comboVal       = document.getElementById('combo-val');

// ════════════════════════════════════════════════════════
//  BAT CURSOR
// ════════════════════════════════════════════════════════
document.addEventListener('mousemove', e => {
  cursorEl.style.left = e.clientX + 'px';
  cursorEl.style.top  = e.clientY + 'px';
});
document.addEventListener('mousedown', () => {
  cursorEl.classList.add('swing');
  setTimeout(() => cursorEl.classList.remove('swing'), 220);
});

// ════════════════════════════════════════════════════════
//  FACE UPLOAD
// ════════════════════════════════════════════════════════
document.getElementById('face-upload').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    customFace = ev.target.result;
    const prev = document.getElementById('preview-img');
    prev.src = customFace; prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

// ════════════════════════════════════════════════════════
//  SVG FACES
// ════════════════════════════════════════════════════════

// ── Shared base (head shape, hair, glasses, tie) ──
function baseHead(skinTone = '#FFDAB9') {
  return `
  <ellipse cx="36" cy="40" rx="29" ry="31" fill="${skinTone}" stroke="#e0a070" stroke-width="1.5"/>
  <ellipse cx="36" cy="12"  rx="29" ry="11" fill="#4a3728"/>
  <rect x="7" y="10" width="58" height="12" fill="#4a3728"/>
  <rect x="15" y="30" width="18" height="13" rx="5" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="39" y="30" width="18" height="13" rx="5" fill="none" stroke="#333" stroke-width="2"/>
  <line x1="33" y1="36" x2="39" y2="36" stroke="#333" stroke-width="2"/>
  <line x1="8"  y1="34" x2="15" y2="34" stroke="#333" stroke-width="1.5"/>
  <line x1="57" y1="34" x2="63" y2="34" stroke="#333" stroke-width="1.5"/>`;
}
function baseTie() {
  return `
  <path d="M28 68 L36 82 L44 68 Q36 72 28 68Z" fill="#c0392b"/>
  <rect x="30" y="66" width="12" height="6" fill="#e74c3c" rx="2"/>`;
}

// ── Normal idle expressions (3 variants) ──
const IDLE_FACES = [
  // serious
  () => baseHead() + `
    <ellipse cx="24" cy="36" rx="5" ry="5" fill="white"/>
    <ellipse cx="48" cy="36" rx="5" ry="5" fill="white"/>
    <circle  cx="25" cy="37" r="3" fill="#222"/>
    <circle  cx="49" cy="37" r="3" fill="#222"/>
    <ellipse cx="36" cy="47" rx="4" ry="3" fill="#e8c0a0"/>
    <path d="M26 54 Q36 51 46 54" stroke="#555" stroke-width="2.5" fill="none" stroke-linecap="round"/>` + baseTie(),
  // smug
  () => baseHead() + `
    <ellipse cx="24" cy="36" rx="5" ry="5" fill="white"/>
    <ellipse cx="48" cy="36" rx="5" ry="5" fill="white"/>

// Shuffle deck — plays all 20 lines before any repeats
let linesDeck = [];
function getBossLine() {
  if (linesDeck.length === 0) {
    // Refill & Fisher-Yates shuffle
    linesDeck = [...BOSS_LINES];
    for (let i = linesDeck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [linesDeck[i], linesDeck[j]] = [linesDeck[j], linesDeck[i]];
    }
  }
  return linesDeck.pop();
}

let lastHitIdx = -1;
function getHitFaceIdx() {
  // don't repeat same expression twice in a row
  let idx;
  do { idx = Math.floor(Math.random() * HIT_FACES.length); }
  while (idx === lastHitIdx);
  lastHitIdx = idx;
  return idx;
}

// ════════════════════════════════════════════════════════
//  HIT LOGIC
// ════════════════════════════════════════════════════════
function hitBoss(index, cx, cy) {
  activeSlots.delete(index);
  const { wrap } = slots[index];

  // random hit expression — ALWAYS show SVG (regardless of custom face)
  const hitIdx = getHitFaceIdx();
  setHitFace(index, hitIdx);

  // pick a random boss line (independent of face expression)
  const line = getBossLine();

  // sounds
  playHitSound();
  speakReaction(line);

  // reaction bubble
  const bubble = document.createElement('div');
  bubble.className = 'reaction-bubble';
  bubble.textContent = line;
  wrap.appendChild(bubble);
  setTimeout(() => bubble.remove(), 1800);

  // combo
  combo++;
  clearTimeout(comboTimer);
  comboTimer = setTimeout(() => { combo = 0; combDisplay.classList.remove('active'); }, 1400);
  combDisplay.classList.add('active');
  comboVal.textContent = combo;

  const pts = combo >= 3 ? combo * 10 : 10;
  score += pts;
  scoreDisplay.textContent = score;
  showScorePop(cx, cy, `+${pts}`);

  // PHASE 1: shake-in-place (0.35s) then FREEZE showing expression (750ms total)
  wrap.classList.add('hit-freeze');

  setTimeout(() => {
    // PHASE 2: exit animation
    wrap.classList.remove('hit-freeze');
    wrap.classList.remove('visible');
    wrap.classList.add('hit-anim');
    setTimeout(() => {
      wrap.classList.remove('hit-anim');
      setIdleFace(index);
    }, 440);
  }, 750);
}

function showScorePop(cx, cy, text) {
  const rect = gameArea.getBoundingClientRect();
  const d = document.createElement('div');
  d.className = 'score-pop'; d.textContent = text;
  // divide by scale so popup appears at correct internal position
  d.style.left = ((cx - rect.left) / gameScale - 20) + 'px';
  d.style.top  = ((cy - rect.top)  / gameScale - 20) + 'px';
  gameArea.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playHitSound() {
  try {
    const ctx = getAudioCtx();
    const now = ctx.currentTime;

    // Low THWACK thud
    const thud = ctx.createOscillator();
    const thudGain = ctx.createGain();
    thud.type = 'sine';
    thud.frequency.setValueAtTime(180, now);
    thud.frequency.exponentialRampToValueAtTime(40, now + 0.12);
    thudGain.gain.setValueAtTime(1.0, now);
    thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
    thud.connect(thudGain); thudGain.connect(ctx.destination);
    thud.start(now); thud.stop(now + 0.18);

    // Crack snap (short noise burst)
    const dur = 0.06;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++)
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/data.length, 3);
    const crack = ctx.createBufferSource();
    crack.buffer = buf;
    const crackFilter = ctx.createBiquadFilter();
    crackFilter.type = 'highpass'; crackFilter.frequency.value = 1200;
    const crackGain = ctx.createGain();
    crackGain.gain.setValueAtTime(0.6, now);
    crack.connect(crackFilter); crackFilter.connect(crackGain); crackGain.connect(ctx.destination);
    crack.start(now);
  } catch(e) {}
}

// Speak the reaction text using Vietnamese TTS
function speakReaction(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  // Strip emoji for cleaner pronunciation
  const clean = text.replace(/[\u{1F300}-\u{1FFFF}]/gu, '').trim();
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang = 'vi-VN';
  utt.rate = 0.88;   // chậm hơn, nghe nặng nề hơn
  utt.pitch = 0.6;   // trầm, giọng ông sếp to con
  utt.volume = 1.0;
  // Try Vietnamese voice; fall back to any available
  const voices = window.speechSynthesis.getVoices();
  const viVoice = voices.find(v => v.lang.startsWith('vi'));
  if (viVoice) utt.voice = viVoice;
  window.speechSynthesis.speak(utt);
}

  [494,0.11],[587,0.11],[659,0.22],[659,0.11],[587,0.11],[494,0.11],[587,0.11],
  [440,0.22],[440,0.11],[392,0.11],[440,0.22],
  [392,0.11],[440,0.11],[494,0.11],[440,0.11],[392,0.11],[330,0.11],
  [349,0.11],[330,0.11],[294,0.11],[262,0.11],[262,0.44],[0,0.22],
];
const BG_BASS = [131,147,165,131, 147,165,175,147];

function startBgMusic() {
  if (bgMusicRunning) return;
  bgMusicRunning = true;
  const ctx = getAudioCtx();
  bgGainNode = ctx.createGain();
  bgGainNode.gain.value = 0.07;   // quiet background
  bgGainNode.connect(ctx.destination);

  let nextTime  = ctx.currentTime + 0.05;
  let noteIdx   = 0;
  let bassIdx   = 0;
  let beatTick  = 0;

  function schedule() {
    if (!bgMusicRunning) return;
    while (nextTime < ctx.currentTime + 0.55) {
      const [freq, dur] = BG_MELODY[noteIdx % BG_MELODY.length];

      // ── Melody (square wave – retro chiptune) ──
      if (freq > 0) {
        const osc = ctx.createOscillator();
        const env = ctx.createGain();
        osc.type = 'square';
        osc.frequency.value = freq;
        osc.detune.value = (Math.random()-0.5)*6;
        env.gain.setValueAtTime(0.45, nextTime);
        env.gain.setValueAtTime(0.45, nextTime + dur*0.75);
        env.gain.linearRampToValueAtTime(0, nextTime + dur*0.96);
        osc.connect(env); env.connect(bgGainNode);
        osc.start(nextTime); osc.stop(nextTime + dur);
      }

      // ── Bass (triangle, every 4 notes) ──
      if (beatTick % 4 === 0) {
        const bf = BG_BASS[bassIdx % BG_BASS.length];
        bassIdx++;
        const bo = ctx.createOscillator();
        const be = ctx.createGain();
        bo.type = 'triangle'; bo.frequency.value = bf;
        be.gain.setValueAtTime(0.9, nextTime);
        be.gain.exponentialRampToValueAtTime(0.001, nextTime + 0.38);
        bo.connect(be); be.connect(bgGainNode);
        bo.start(nextTime); bo.stop(nextTime + 0.38);
      }

      // ── Snare click on off-beats ──
      if (beatTick % 8 === 4) {
        const sLen = 0.055;
        const sBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate*sLen), ctx.sampleRate);
        const sD   = sBuf.getChannelData(0);
        for (let i=0;i<sD.length;i++) sD[i]=(Math.random()*2-1)*(1-i/sD.length);
        const sSrc = ctx.createBufferSource();
        sSrc.buffer = sBuf;
        const sFlt = ctx.createBiquadFilter();
        sFlt.type='bandpass'; sFlt.frequency.value=2200; sFlt.Q.value=0.9;
        const sEnv = ctx.createGain();
        sEnv.gain.setValueAtTime(0.28, nextTime);
        sSrc.connect(sFlt); sFlt.connect(sEnv); sEnv.connect(bgGainNode);
        sSrc.start(nextTime);
      }

      nextTime += dur;
      noteIdx++;
      beatTick++;
    }
    setTimeout(schedule, 90);
  }
  schedule();
}

function stopBgMusic() {
  bgMusicRunning = false;
  if (bgGainNode) {
    try {
      const ctx = getAudioCtx();
      bgGainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
    } catch(e) {}
    bgGainNode = null;
  }
}

// ════════════════════════════════════════════════════════
//  SPAWNING
// ════════════════════════════════════════════════════════
function progress() { return 1 - timeLeft / TOTAL_TIME; }
function jittered(base) { return base * (1 + (Math.random()*2-1) * JITTER); }

function spawnBoss() {
  if (!running) return;
  const avail = [];
  for (let i = 0; i < NUM_HOLES; i++) if (!activeSlots.has(i)) avail.push(i);
  if (!avail.length) return scheduleSpawn();

  const idx = avail[Math.floor(Math.random() * avail.length)];
  activeSlots.add(idx);
  const { wrap } = slots[idx];
  setIdleFace(idx);
  wrap.classList.remove('hit-anim');
  wrap.classList.add('visible');

  const p = progress();
  const showMs = jittered(Math.max(MIN_SHOW_MS, BASE_SHOW_MS - p*(BASE_SHOW_MS-MIN_SHOW_MS)));
  setTimeout(() => {
    if (activeSlots.has(idx)) {
      activeSlots.delete(idx);
      wrap.classList.remove('visible');
    }
  }, showMs);

  scheduleSpawn();
}

function scheduleSpawn() {
  if (!running) return;
  const p = progress();
  const intv = jittered(Math.max(MIN_INTERVAL, BASE_INTERVAL - p*(BASE_INTERVAL-MIN_INTERVAL)));
  spawnTimer = setTimeout(spawnBoss, intv);
}

// ════════════════════════════════════════════════════════
//  TIMER
// ════════════════════════════════════════════════════════
function tick() {
  timeLeft--;
  timerDisplay.textContent = timeLeft;
  timerBar.style.width = (timeLeft / TOTAL_TIME * 100) + '%';
  if (timeLeft <= 10) {
    timerDisplay.style.color = '#ff4444';
    timerBar.style.background = '#ff4444';
  }
  if (timeLeft <= 0) endGame();
  else countdownTimer = setTimeout(tick, 1000);
}

// ════════════════════════════════════════════════════════
//  GAME CONTROL
// ════════════════════════════════════════════════════════
function startGame() {
  score = 0; timeLeft = TOTAL_TIME; combo = 0; running = true;
  activeSlots.clear();
  scoreDisplay.textContent = '0';
  timerDisplay.textContent = TOTAL_TIME;
  timerDisplay.style.color = '#ff6b6b';
  timerBar.style.width = '100%';
  timerBar.style.background = 'linear-gradient(90deg,#ff6b6b,#ffd700)';
  startOverlay.style.display = 'none';
  gameoverOverlay.style.display = 'none';
  slots.forEach(s => s.wrap.classList.remove('visible','hit-anim'));
  startBgMusic();
  countdownTimer = setTimeout(tick, 1000);
  scheduleSpawn();
}

function endGame() {
  running = false;
  clearTimeout(spawnTimer); clearTimeout(countdownTimer);
  slots.forEach(s => s.wrap.classList.remove('visible'));
  activeSlots.clear();
  stopBgMusic();
  window.speechSynthesis && window.speechSynthesis.cancel();
  finalScore.textContent = score;
  rankText.textContent = getRank(score);
  gameoverOverlay.style.display = 'flex';
}

function getRank(s) {
  if (s >= 600) return '🏆 Sếp đã xin thôi việc rồi!';
  if (s >= 400) return '💪 Chiến binh văn phòng đỉnh!';
  if (s >= 200) return '😤 Ổn đấy, vụt mạnh hơn nữa!';
  if (s >= 80)  return '🐢 Cần tập thêm sức mạnh cổ tay...';
  return '😴 Sếp đang ngủ mà bạn cũng ngủ à?';
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);
gameArea.addEventListener('mouseleave', () => { combo = 0; combDisplay.classList.remove('active'); });
</script>
